    <!-- RIGHT BRAND TYPOGRAPHY -->
    <text x="145" y="65" fill="url(#textHorizGradH)" font-family="'Plus Jakarta Sans', 'Cinzel', 'Playfair Display', sans-serif" font-size="28" font-weight="700" letter-spacing="6">
      ANAHITA
    </text>
    <text x="146" y="92" fill="url(#textHorizGradH)" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="14" font-weight="500" letter-spacing="8" opacity="0.92">
      HOSPITALITY
    </text>
    
    <!-- Delicate accent line -->
    <line x1="146" y1="104" x2="490" y2="104" stroke="url(#textHorizGradH)" stroke-width="0.8" opacity="0.35" />
  </g>
