      <!-- Offset Inner Secondary Ring -->
      <path d="M 102 235 A 152 152 0 1 1 398 175" fill="none" stroke="url(#wreathGradH)" stroke-width="1.8" opacity="0.85" />

      <!-- TOP-RIGHT BOTANICAL LEAF BRANCH -->
