      <g stroke="url(#wreathGradH)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 130 290 C 110 310 85 325 65 315 C 55 308 62 290 80 275" stroke-width="2.2" />
        <path d="M 95 322 C 80 340 60 338 68 322 C 78 312 90 318 95 322 Z" fill="none" stroke-width="1.8" />
        <path d="M 92 323 L 74 330" stroke-width="1.2" />
        <path d="M 75 314 C 52 320 40 304 56 294 C 68 288 78 302 75 314 Z" fill="none" stroke-width="1.8" />
        <path d="M 73 312 L 55 305" stroke-width="1.2" />
        <path d="M 82 290 C 58 288 52 268 70 262 C 82 262 86 278 82 290 Z" fill="none" stroke-width="1.8" />
        <path d="M 80 288 L 66 275" stroke-width="1.2" />
        <path d="M 112 308 C 102 326 86 320 94 306 C 102 298 110 302 112 308 Z" fill="none" stroke-width="1.6" />
        <path d="M 110 308 L 98 316" stroke-width="1.0" />
        <path d="M 102 288 C 88 298 78 285 88 276 C 98 272 104 282 102 288 Z" fill="none" stroke-width="1.6" />
        <path d="M 101 287 L 90 286" stroke-width="1.0" />
