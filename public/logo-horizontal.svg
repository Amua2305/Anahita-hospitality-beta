        <path d="M 425 96 C 448 90 460 106 444 116 C 432 122 422 108 425 96 Z" fill="none" stroke-width="1.8" />
        <path d="M 427 98 L 445 105" stroke-width="1.2" />
        <path d="M 418 120 C 442 122 448 142 430 148 C 418 148 414 132 418 120 Z" fill="none" stroke-width="1.8" />
        <path d="M 420 122 L 434 135" stroke-width="1.2" />
        <path d="M 388 102 C 398 84 414 90 406 104 C 398 112 390 108 388 102 Z" fill="none" stroke-width="1.6" />
        <path d="M 390 102 L 402 94" stroke-width="1.0" />
        <path d="M 398 122 C 412 112 422 125 412 134 C 402 138 396 128 398 122 Z" fill="none" stroke-width="1.6" />
        <path d="M 399 123 L 410 124" stroke-width="1.0" />
      </g>

