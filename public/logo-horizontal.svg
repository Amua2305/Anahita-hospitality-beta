      <g fill="url(#ahVertGradH)">
        <path d="M 152 305 L 152 297 C 165 297 172 293 182 268 L 220 162 C 226 145 230 120 236 120 C 241 120 244 135 248 148 L 282 258 C 290 285 298 297 312 297 L 312 305 L 258 305 L 258 297 C 269 297 274 292 268 274 L 258 244 L 202 244 L 188 280 C 183 293 189 297 200 297 L 200 305 Z M 207 228 L 252 228 L 233 162 Z" />
