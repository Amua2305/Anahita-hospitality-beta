<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%">
  <defs>
    <!-- AH Monogram Vertical Gradient -->
    <linearGradient id="ahVertGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a83c6c" />
      <stop offset="22%" stop-color="#c44d7d" />
      <stop offset="50%" stop-color="#dd6e4d" />
      <stop offset="78%" stop-color="#efa33d" />
      <stop offset="100%" stop-color="#f8d655" />
    </linearGradient>

    <!-- Wreath & Double Ring Gradient -->
    <linearGradient id="wreathGradH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0613e" />
      <stop offset="35%" stop-color="#e88047" />
      <stop offset="70%" stop-color="#f2ad45" />
      <stop offset="100%" stop-color="#f9d863" />
    </linearGradient>

    <!-- Text Horizontal Gradient -->
    <linearGradient id="textHorizGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f282a5" />
      <stop offset="25%" stop-color="#e87895" />
      <stop offset="55%" stop-color="#e88965" />
      <stop offset="82%" stop-color="#f3bd49" />
      <stop offset="100%" stop-color="#f8dc65" />
    </linearGradient>

    <filter id="subtleGlowH" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.0" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#subtleGlowH)">
